<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Trắc Nghiệm Linh Kiện Điện Tử</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .correct-answer { background-color: #d1fae5; border-color: #10b981; }
        .wrong-answer { background-color: #fee2e2; border-color: #ef4444; }
        .missed-answer { background-color: #fef3c7; border-color: #f59e0b; }
        input[type="radio"]:disabled { cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-xl shadow-lg p-6 md:p-10 mb-8 border-t-4 border-blue-500">
            <h1 class="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-4">Ôn Tập Linh Kiện Điện Tử</h1>
            <p class="text-center text-gray-600 mb-2">Diode – BJT – FET – Op-amp</p>
            <p class="text-center text-sm text-gray-500 mb-6 bg-gray-100 py-2 rounded-lg">Đề thi gồm 60 câu hỏi được chọn ngẫu nhiên từ ngân hàng câu. Chúc bạn làm bài tốt!</p>
            
            <div id="quiz-container" class="space-y-8">
                <!-- Câu hỏi sẽ được render ở đây bằng JS -->
            </div>
            
            <div class="text-center mt-10">
                <button id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition duration-300 transform hover:scale-105">
                    Nộp Bài
                </button>
            </div>
        </div>

        <div id="result-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center transform transition-all">
                <h2 class="text-3xl font-bold mb-4 text-gray-800">Kết Quả</h2>
                <div class="text-5xl font-extrabold text-blue-600 mb-2" id="score-display">0/60</div>
                <p class="text-gray-600 mb-8" id="score-text">Bạn đã hoàn thành bài thi!</p>
                <div class="flex flex-col space-y-3">
                    <button id="review-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg transition duration-300">Xem lại bài làm</button>
                    <button id="retry-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition duration-300">Làm đề mới ngẫu nhiên</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            // DIODE
            { q: "Thuật ngữ phân cực (bias) có nghĩa là:", opts: { a: "tỉ số giữa hạt dẫn đa số và hạt dẫn thiểu số", b: "lượng dòng điện chạy qua diode", c: "một điện áp một chiều được đặt vào để điều khiển hoạt động của linh kiện", d: "không phải (a), (b) hay (c)" }, ans: "c" },
            { q: "Để phân cực thuận cho diode:", opts: { a: "đặt điện áp ngoài dương ở anode và âm ở catot", b: "đặt điện áp ngoài âm ở anode và dương ở catot", c: "đặt điện áp ngoài dương ở vùng p và âm ở vùng n", d: "cả (a) và (c)" }, ans: "d" },
            { q: "Khi diode phân cực thuận:", opts: { a: "dòng điện chỉ là dòng lỗ trống", b: "dòng điện chỉ là dòng electron", c: "dòng điện chỉ do hạt dẫn đa số tạo ra", d: "dòng điện do cả lỗ trống và electron tạo ra" }, ans: "d" },
            { q: "Mặc dù dòng bị chặn khi phân cực ngược:", opts: { a: "vẫn có dòng do hạt dẫn đa số", b: "có một dòng rất nhỏ do hạt dẫn thiểu số", c: "có dòng thác lũ" }, ans: "b" },
            { q: "Với diode silicon, giá trị điện áp phân cực thuận thường:", opts: { a: "phải lớn hơn 0,3 V", b: "phải lớn hơn 0,7 V", c: "phụ thuộc bề rộng vùng nghèo", d: "phụ thuộc nồng độ hạt dẫn đa số" }, ans: "b" },
            { q: "Khi phân cực thuận, diode:", opts: { a: "chặn dòng", b: "dẫn dòng", c: "có điện trở lớn", d: "sụt áp lớn" }, ans: "b" },
            { q: "Diode thường được sử dụng ở:", opts: { a: "vùng đánh thủng ngược", b: "vùng phân cực thuận", c: "vùng phân cực ngược", d: "(b) hoặc (c)" }, ans: "d" },
            { q: "Điện trở động có thể quan trọng khi diode:", opts: { a: "phân cực ngược", b: "phân cực thuận", c: "ở trong vùng đánh thủng ngược", d: "không phân cực" }, ans: "b" },
            { q: "Đường đặc tuyến V-I của diode cho biết:", opts: { a: "điện áp trên diode ứng với một dòng nhất định", b: "lượng dòng điện ứng với một điện áp phân cực nhất định", c: "công suất tiêu tán", d: "không cái nào ở trên" }, ans: "b" },
            { q: "Về lý tưởng, diode có thể được biểu diễn bằng:", opts: { a: "nguồn điện áp", b: "điện trở", c: "công tắc", d: "tất cả các loại trên" }, ans: "c" },
            { q: "Trong mô hình diode thực tế:", opts: { a: "có tính đến thế hàng rào", b: "có tính đến điện trở động thuận", c: "không có yếu tố nào ở trên", d: "có tính cả (a) và (b)" }, ans: "a" },
            { q: "Trong mô hình diode đầy đủ:", opts: { a: "có tính đến thế hàng rào", b: "có tính đến điện trở động thuận", c: "có tính đến điện trở ngược", d: "tất cả các yếu tố trên" }, ans: "d" },
            { q: "Giá trị trung bình của điện áp chỉnh lưu nửa chu kỳ có đỉnh 200 V là:", opts: { a: "63,7 V", b: "127,2 V", c: "141 V", d: "0 V" }, ans: "a" },
            { q: "Khi đưa điện áp hình sin 60 Hz vào chỉnh lưu nửa chu kỳ, tần số ngõ ra là:", opts: { a: "120 Hz", b: "30 Hz", c: "60 Hz", d: "0 Hz" }, ans: "c" },
            { q: "Đỉnh điện áp vào chỉnh lưu nửa chu kỳ là 10 V. Đỉnh gần đúng của điện áp ra là:", opts: { a: "10 V", b: "3,18 V", c: "10,7 V", d: "9,3 V" }, ans: "d" },
            { q: "Với mạch chỉnh lưu nửa chu kỳ có điện áp đỉnh ngõ vào 10 V, diode phải chịu được điện áp ngược là:", opts: { a: "10 V", b: "5 V", c: "20 V", d: "3,18 V" }, ans: "a" },
            { q: "Giá trị trung bình của điện áp chỉnh lưu toàn chu kỳ có đỉnh 75 V là:", opts: { a: "53 V", b: "47,8 V", c: "37,5 V", d: "23,9 V" }, ans: "b" },
            { q: "Khi đưa điện áp hình sin 60 Hz vào chỉnh lưu toàn chu kỳ, tần số ngõ ra là:", opts: { a: "120 Hz", b: "60 Hz", c: "240 Hz", d: "0 Hz" }, ans: "a" },
            { q: "Tổng điện áp thứ cấp của mạch chỉnh lưu toàn chu kỳ có điểm giữa là 125 V rms. Bỏ qua sụt áp diode, điện áp ra rms là:", opts: { a: "125 V", b: "177 V", c: "100 V", d: "62,5 V" }, ans: "d" },
            { q: "Khi điện áp ra đỉnh là 100 V, PIV của mỗi diode trong mạch chỉnh lưu toàn chu kỳ có điểm giữa là (bỏ qua sụt áp diode):", opts: { a: "100 V", b: "200 V", c: "141 V", d: "50 V" }, ans: "b" },
            { q: "Khi điện áp ra rms của chỉnh lưu cầu là 20 V, điện áp ngược đỉnh trên các diode là (bỏ qua sụt áp diode):", opts: { a: "20 V", b: "40 V", c: "28,3 V", d: "56,6 V" }, ans: "c" },
            { q: "Một điện áp hình sin 10 V đỉnh–đỉnh được đặt lên mạch gồm diode silicon nối tiếp điện trở. Điện áp lớn nhất trên diode là:", opts: { a: "9,3 V", b: "5 V", c: "0,7 V", d: "10 V", e: "4,3 V" }, ans: "b" },
            { q: "Trong một mạch xén phân cực, điện áp phân cực là 5 V, ngõ vào là sóng sin đỉnh 10 V. Nếu cực dương của nguồn phân cực nối với catot của diode, điện áp lớn nhất ở anode là:", opts: { a: "10 V", b: "5 V", c: "5,7 V", d: "0,7 V" }, ans: "c" },
            { q: "Trong một mạch ghim dương, ngõ vào là sóng sin 120 V rms. Giá trị một chiều của ngõ ra là:", opts: { a: "119,3 V", b: "169 V", c: "60 V", d: "75,6 V" }, ans: "b" },
            { q: "Ngõ vào của mạch nhân đôi điện áp là 120 V rms. Điện áp ngõ ra xấp xỉ:", opts: { a: "240 V", b: "60 V", c: "167 V", d: "339 V" }, ans: "d" },
            { q: "Nếu điện áp vào mạch nhân ba có giá trị rms là 12 V thì điện áp một chiều ra xấp xỉ:", opts: { a: "36 V", b: "50,9 V", c: "33,9 V", d: "32,4 V" }, ans: "b" },
            { q: "Khi diode silicon hoạt động tốt ở chế độ phân cực thuận, đồng hồ DMM ở thang thử diode sẽ chỉ:", opts: { a: "0 V", b: "OL", c: "xấp xỉ 0,7 V", d: "xấp xỉ 0,3 V" }, ans: "c" },
            { q: "Khi diode silicon bị hở, DMM thường chỉ:", opts: { a: "0 V", b: "OL", c: "xấp xỉ 0,7 V", d: "xấp xỉ 0,3 V" }, ans: "b" },
            { q: "Trong mạch chỉnh lưu, nếu cuộn thứ cấp của biến áp bị hở thì ngõ ra:", opts: { a: "0 V", b: "120 V", c: "nhỏ hơn bình thường", d: "không bị ảnh hưởng" }, ans: "a" },
            { q: "Nếu một trong các diode của mạch chỉnh lưu cầu toàn chu kỳ bị hở, ngõ ra là:", opts: { a: "0 V", b: "bằng một phần tư biên độ điện áp vào", c: "điện áp chỉnh lưu nửa chu kỳ", d: "điện áp 120 Hz" }, ans: "c" },
            { q: "Khi kiểm tra mạch chỉnh lưu cầu toàn chu kỳ 60 Hz mà thấy ngõ ra có gợn sóng 60 Hz thì:", opts: { a: "mạch đang hoạt động bình thường", b: "có một diode bị hở", c: "cuộn thứ cấp biến áp bị chập", d: "tụ lọc bị rò" }, ans: "b" },

            // BJT
            { q: "Ba cực của transistor lưỡng cực (BJT) được gọi là:", opts: { a: "p, n, p", b: "n, p, n", c: "ngõ vào, ngõ ra, đất", d: "cực nền, cực phát, cực thu" }, ans: "d" },
            { q: "Trong transistor pnp, các vùng p là:", opts: { a: "cực nền và cực phát", b: "cực nền và cực thu", c: "cực phát và cực thu" }, ans: "c" },
            { q: "Để làm khuếch đại, cực nền của transistor npn phải:", opts: { a: "dương so với cực phát", b: "âm so với cực phát", c: "dương so với cực thu", d: "bằng 0 V" }, ans: "a" },
            { q: "Dòng cực phát luôn:", opts: { a: "lớn hơn dòng nền", b: "nhỏ hơn dòng thu", c: "lớn hơn dòng thu", d: "cả (a) và (c)" }, ans: "d" },
            { q: "βDC của transistor là:", opts: { a: "độ lợi dòng", b: "độ lợi áp", c: "độ lợi công suất", d: "điện trở trong" }, ans: "a" },
            { q: "Nếu IC lớn gấp 50 lần IB thì βDC là:", opts: { a: "0,02", b: "100", c: "50", d: "500" }, ans: "c" },
            { q: "Điện áp gần đúng trên tiếp giáp nền–phát phân cực thuận của BJT silicon là:", opts: { a: "0 V", b: "0,7 V", c: "0,3 V", d: "VBB" }, ans: "b" },
            { q: "Điều kiện phân cực để transistor làm việc như bộ khuếch đại tuyến tính gọi là:", opts: { a: "thuận–ngược", b: "thuận–thuận", c: "ngược–ngược", d: "phân cực cực thu" }, ans: "a" },
            { q: "Nếu ngõ ra của mạch khuếch đại transistor là 5 V rms và ngõ vào là 100 mV rms thì độ lợi áp là:", opts: { a: "5", b: "500", c: "50", d: "100" }, ans: "c" },
            { q: "Khi hoạt động ở vùng ngắt và bão hòa, transistor hoạt động như:", opts: { a: "bộ khuếch đại tuyến tính", b: "công tắc", c: "tụ điện biến đổi", d: "điện trở biến đổi" }, ans: "b" },
            { q: "Ở trạng thái ngắt, VCE:", opts: { a: "bằng 0 V", b: "nhỏ nhất", c: "lớn nhất", d: "bằng VCC", e: "cả (a) và (b)", f: "cả (c) và (d)" }, ans: "f" },
            { q: "Ở trạng thái bão hòa, VCE:", opts: { a: "0,7 V", b: "bằng VCC", c: "nhỏ nhất", d: "lớn nhất" }, ans: "c" },
            { q: "Để làm BJT bão hòa:", opts: { a: "IB = IC(sat)", b: "IB > IC(sat) / βDC", c: "VCC phải ít nhất 10 V", d: "cực phát phải nối đất" }, ans: "b" },
            { q: "Khi đã bão hòa, nếu tiếp tục tăng dòng nền thì:", opts: { a: "dòng thu tăng", b: "dòng thu không bị ảnh hưởng", c: "dòng thu giảm", d: "transistor tắt" }, ans: "b" },

            // FET
            { q: "JFET là:", opts: { a: "linh kiện đơn cực", b: "linh kiện điều khiển bằng điện áp", c: "linh kiện điều khiển bằng dòng điện", d: "cả (a) và (c)", e: "cả (a) và (b)" }, ans: "e" },
            { q: "Kênh dẫn của JFET nằm giữa:", opts: { a: "cổng và máng", b: "máng và nguồn", c: "cổng và nguồn", d: "ngõ vào và ngõ ra" }, ans: "b" },
            { q: "JFET luôn hoạt động với:", opts: { a: "tiếp giáp pn cổng–nguồn phân cực ngược", b: "tiếp giáp pn cổng–nguồn phân cực thuận", c: "máng nối đất", d: "cổng nối với nguồn" }, ans: "a" },
            { q: "Với VGS = 0 V, dòng máng trở nên không đổi khi VDS vượt quá:", opts: { a: "điểm ngắt", b: "VDD", c: "VP", d: "0 V" }, ans: "c" },
            { q: "Vùng dòng không đổi của FET nằm giữa:", opts: { a: "ngắt và bão hòa", b: "ngắt và thắt kênh", c: "0 và IDSS", d: "thắt kênh và đánh thủng" }, ans: "d" },
            { q: "IDSS là:", opts: { a: "dòng máng khi nguồn được nối tắt (với cổng)", b: "dòng máng ở trạng thái ngắt", c: "dòng máng lớn nhất có thể", d: "dòng máng ở điểm giữa" }, ans: "a" },
            { q: "Dòng máng trong vùng dòng không đổi tăng khi:", opts: { a: "điện áp phân cực cổng–nguồn giảm", b: "điện áp phân cực cổng–nguồn tăng", c: "điện áp máng–nguồn tăng", d: "điện áp máng–nguồn giảm" }, ans: "a" },
            { q: "Trong một mạch FET có VGS = 0 V, VDD = 15 V, IDSS = 15 mA và RD = 470 Ω. Nếu giảm RD xuống 330 Ω thì IDSS là:", opts: { a: "19,5 mA", b: "10,5 mA", c: "15 mA", d: "1 mA" }, ans: "c" },
            { q: "Ở trạng thái ngắt, kênh JFET:", opts: { a: "rộng nhất", b: "bị vùng nghèo đóng hoàn toàn", c: "rất hẹp", d: "bị phân cực ngược" }, ans: "b" },
            { q: "Datasheet của một JFET cho VGS(off) = -4 V. Điện áp thắt kênh VP:", opts: { a: "không xác định được", b: "bằng -4 V", c: "phụ thuộc VGS", d: "bằng +4 V" }, ans: "d" },
            { q: "JFET có VGS(off) = -4 V là loại:", opts: { a: "kênh n", b: "kênh p", c: "có thể là loại nào cũng được" }, ans: "a" },
            { q: "Một JFET có IGSS = 10 nA tại VGS = 10 V. Điện trở vào là:", opts: { a: "100 MΩ", b: "1 MΩ", c: "1000 MΩ" }, ans: "c" },
            { q: "Một JFET kênh p có VGS(off) = +8 V. Giá trị VGS để phân cực gần điểm giữa là:", opts: { a: "4 V", b: "0 V", c: "1,25 V", d: "2,34 V" }, ans: "d" },
            { q: "Trong JFET tự phân cực, cổng ở:", opts: { a: "điện áp dương", b: "0 V", c: "điện áp âm", d: "đất" }, ans: "b" },
            { q: "MOSFET khác JFET chủ yếu vì:", opts: { a: "công suất định mức", b: "MOSFET có hai cổng", c: "JFET có tiếp giáp pn", d: "MOSFET không có kênh vật lý" }, ans: "c" },
            { q: "D-MOSFET hoạt động ở:", opts: { a: "chỉ chế độ nghèo", b: "chỉ chế độ giàu", c: "chỉ vùng ohmic", d: "cả chế độ nghèo và chế độ giàu" }, ans: "d" },
            { q: "D-MOSFET kênh n với VGS dương đang hoạt động ở:", opts: { a: "chế độ nghèo", b: "chế độ giàu", c: "vùng ngắt", d: "vùng bão hòa" }, ans: "b" },
            { q: "Một E-MOSFET kênh p có VGS(th) = -2 V. Nếu VGS = 0 V thì dòng máng là:", opts: { a: "0 A", b: "ID(on)", c: "cực đại", d: "IDSS" }, ans: "a" },
            { q: "Trong E-MOSFET, không có dòng máng cho đến khi VGS:", opts: { a: "đạt VGS(th)", b: "dương", c: "âm", d: "bằng 0 V" }, ans: "a" },
            { q: "Mọi linh kiện MOS đều có thể bị hỏng do:", opts: { a: "nhiệt độ quá cao", b: "phóng tĩnh điện (ESD)", c: "điện áp quá lớn", d: "tất cả các nguyên nhân trên" }, ans: "b" },
            { q: "Một D-MOSFET được phân cực ở VGS = 0 V. Datasheet cho IDSS = 20 mA và VGS(off) = -5 V. Dòng máng:", opts: { a: "bằng 0 A", b: "không xác định được", c: "bằng 20 mA" }, ans: "c" },

            // Op-amp
            { q: "Một op-amp mạch tích hợp (IC) có:", opts: { a: "hai ngõ vào và hai ngõ ra", b: "một ngõ vào và một ngõ ra", c: "hai ngõ vào và một ngõ ra" }, ans: "c" },
            { q: "Đặc tính nào sau đây không nhất thiết áp dụng cho op-amp?", opts: { a: "độ lợi cao", b: "công suất tiêu thụ thấp", c: "trở kháng vào cao", d: "trở kháng ra thấp" }, ans: "b" },
            { q: "Mạch khuếch đại vi sai:", opts: { a: "là một phần của op-amp", b: "có một ngõ vào và một ngõ ra", c: "có hai ngõ ra", d: "cả (a) và (c)" }, ans: "d" },
            { q: "Khi op-amp hoạt động ở chế độ vi sai một đầu:", opts: { a: "ngõ ra được nối đất", b: "một ngõ vào nối đất và tín hiệu đưa vào ngõ còn lại", c: "hai ngõ vào nối với nhau", d: "ngõ ra không bị đảo" }, ans: "b" },
            { q: "Ở chế độ vi sai hai đầu:", opts: { a: "tín hiệu đặt giữa hai ngõ vào", b: "độ lợi bằng 1", c: "các ngõ ra có biên độ khác nhau", d: "chỉ dùng một nguồn cấp" }, ans: "a" },
            { q: "Ở chế độ chung:", opts: { a: "cả hai ngõ vào nối đất", b: "các ngõ ra nối với nhau", c: "một tín hiệu giống hệt nhau xuất hiện trên cả hai ngõ vào", d: "các tín hiệu ra cùng pha" }, ans: "c" },
            { q: "Độ lợi chế độ chung của Op-amp:", opts: { a: "rất cao", b: "rất thấp", c: "luôn bằng 1", d: "không dự đoán được" }, ans: "b" }
        ];

        let selectedQuestions = [];
        const TOTAL_QUESTIONS = 60;

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            // Trộn ngân hàng câu hỏi và lấy 60 câu
            const shuffledBank = shuffleArray([...questionBank]);
            selectedQuestions = shuffledBank.slice(0, TOTAL_QUESTIONS);
            
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; // Clear old

            selectedQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'p-5 border rounded-lg shadow-sm bg-white hover:shadow-md transition-shadow';
                questionDiv.id = `q-block-${index}`;

                let html = `<h3 class="font-semibold text-lg text-gray-800 mb-3"><span class="text-blue-600 mr-1">Câu ${index + 1}:</span> ${q.q}</h3><div class="space-y-2">`;
                
                for (const [key, value] of Object.entries(q.opts)) {
                    html += `
                        <label class="flex items-center space-x-3 cursor-pointer p-3 rounded-md border border-gray-200 hover:bg-gray-50 transition-colors" id="label-${index}-${key}">
                            <input type="radio" name="q${index}" value="${key}" class="form-radio h-5 w-5 text-blue-600">
                            <span class="text-gray-700">${key.toUpperCase()}. ${value}</span>
                        </label>
                    `;
                }
                html += `</div>`;
                questionDiv.innerHTML = html;
                container.appendChild(questionDiv);
            });
        }

        function submitQuiz() {
            let score = 0;
            const container = document.getElementById('quiz-container');

            selectedQuestions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                
                // Vô hiệu hóa tất cả input sau khi nộp
                document.querySelectorAll(`input[name="q${index}"]`).forEach(input => input.disabled = true);

                const correctLabel = document.getElementById(`label-${index}-${q.ans}`);
                correctLabel.classList.add('correct-answer');

                if (selectedOption) {
                    if (selectedOption.value === q.ans) {
                        score++;
                    } else {
                        const wrongLabel = document.getElementById(`label-${index}-${selectedOption.value}`);
                        wrongLabel.classList.add('wrong-answer');
                    }
                } else {
                    const block = document.getElementById(`q-block-${index}`);
                    block.classList.add('border-yellow-400');
                    correctLabel.classList.add('missed-answer');
                }
            });

            // Hiện Modal điểm
            const resultModal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('score-display');
            const scoreText = document.getElementById('score-text');
            
            scoreDisplay.textContent = `${score}/${TOTAL_QUESTIONS}`;
            
            let feedback = '';
            const ratio = score / TOTAL_QUESTIONS;
            if(ratio >= 0.8) feedback = 'Tuyệt vời! Bạn nắm kiến thức rất vững.';
            else if(ratio >= 0.5) feedback = 'Khá tốt! Hãy ôn lại thêm một chút nữa nhé.';
            else feedback = 'Cố gắng lên! Bạn cần ôn tập kỹ lại lý thuyết.';
            
            scoreText.textContent = feedback;
            resultModal.classList.remove('hidden');
            document.getElementById('submit-btn').style.display = 'none';
        }

        document.getElementById('submit-btn').addEventListener('click', submitQuiz);
        
        document.getElementById('review-btn').addEventListener('click', () => {
            document.getElementById('result-modal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('submit-btn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            initQuiz();
        });

        // Chạy quiz khi vừa load xong trang
        initQuiz();
    </script>
</body>
</html>
